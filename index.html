<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stackfall">
<meta name="theme-color" content="#0b0d22">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Stackfall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,300;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed 3D tower in a dusk sky (the app icon's world). HUD hugs the top: pause · floors + clock · sound.
   The question plate sits under it; three answer plates are pinned to the bottom with the landmark line above them.
   Menus, pause and results are one dark glass sheet over the live scene — the same family as Lanefall. */
:root{
  --bg:#070a0f; --ink:#e8eef4; --soft:#b3c0cd; --dim:#8d9bab; --line:rgba(232,238,244,.14); --line2:rgba(232,238,244,.32);
  --glass:rgba(9,13,19,.74); --chip:rgba(232,238,244,.05); --plate:rgba(8,11,16,.86);
  --ember:#e5523c; --ember2:#ff6a4f; --good:#5fd39a; --bad:#ff6b5a; --gold:#ffd23f;
  --sun-d:var(--gold); --coral-d:var(--ember2); --good-d:var(--good);
  --display:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html,body{height:100%;margin:0;overflow:hidden;background:#0b0d22;color:var(--ink);font:400 14px/1.4 var(--mono);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;position:fixed;left:0;top:0;width:100vw;height:100vh;height:100lvh}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.ui{position:fixed;left:0;right:0;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.off{opacity:0!important;pointer-events:none!important;visibility:hidden}
.push{cursor:pointer}
.eyebrow{font:400 13px/1.3 var(--mono);color:var(--soft);margin:0}

/* ---------- HUD ---------- */
#hud{top:calc(10px + env(safe-area-inset-top,0px));display:grid;grid-template-columns:44px 1fr 44px;align-items:start;transition:opacity .4s,visibility .4s}
.round{pointer-events:auto;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--glass);
  display:grid;place-content:center;grid-auto-flow:column;gap:4px;padding:0}
#pause i{display:block;width:3px;height:13px;border-radius:2px;background:var(--ink)}
#mute{font:500 17px/1 var(--display);position:relative}
#mute[aria-pressed="false"]::after{content:"";position:absolute;left:11px;right:11px;top:50%;height:1.5px;background:var(--ink);transform:rotate(-45deg)}
#mid{display:grid;justify-items:center;gap:7px;position:relative}
#meters{display:flex;gap:8px}
.meter{display:grid;justify-items:center;gap:3px;background:rgba(8,11,16,.82);padding:5px 16px 7px;border-radius:14px;min-width:78px}
.meter b{font:400 40px/1 var(--display);font-variant-numeric:tabular-nums}
.meter small{font:400 11px/1 var(--mono);color:var(--dim);transition:color .2s}
#clockL.good{color:var(--good)} #clockL.bad{color:var(--bad)}
#clockN.bump{animation:bump .25s ease-out}
#floorsN.bump{animation:bump .25s ease-out}
@keyframes bump{50%{transform:scale(1.14)}}
#clock.low b{color:var(--bad)}
#clock.low{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 1.5px rgba(255,107,90,.55)}}
#timebar{width:174px;height:3px;display:block;overflow:visible}
#timebar line{stroke-width:3;stroke-linecap:round}
#timebar .track{stroke:var(--line)}
#timebar .fill{stroke:var(--ink);transition:stroke .3s}
#clock.low ~ #timebar .fill,#timebar.low .fill{stroke:var(--bad)}
#chips{display:flex;gap:6px;justify-content:center;min-height:24px}
.chip{font:500 12px/1 var(--mono);padding:6px 10px;border-radius:999px;border:1px solid rgba(255,210,63,.5);
  background:var(--glass);color:var(--gold);font-variant-numeric:tabular-nums}
.chip b{font-weight:500}
#streak.bounce{animation:bump .3s ease-out}

/* ---------- Question + answers ---------- */
#qbox{top:calc(130px + env(safe-area-inset-top,0px));display:grid;justify-items:center;gap:10px;transition:opacity .3s,transform .3s,visibility .3s}
#qbox.off{transform:translateY(-8px)}
#qimg{height:64px;width:auto;border-radius:4px;box-shadow:0 8px 28px rgba(0,0,0,.55)}
#qtext{font:500 clamp(26px,7.4vw,40px)/1.08 var(--display);text-align:center;text-wrap:balance;max-width:min(22ch,100%);background:var(--plate);padding:10px 20px 13px;border-radius:18px;color:#fff;overflow-wrap:anywhere}
#qtext.code{font:500 clamp(20px,5.8vw,27px)/1.2 var(--mono);max-width:100%}
#qtag{font:400 12px/1 var(--mono);color:var(--soft);background:var(--plate);padding:6px 10px;border-radius:999px}
#qbox.wrong #qtext{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
#answers{bottom:0;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));transition:opacity .25s,transform .25s,visibility .25s}
#answers.off{transform:translateY(10px)}
.wrap{width:min(100%,460px);margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
#next{justify-self:center;display:flex;align-items:center;gap:9px;background:var(--plate);border-radius:12px;padding:7px 12px;font:400 11px/1.35 var(--mono);color:var(--soft);max-width:100%;min-width:0}
#next b{font:400 19px/1 var(--display);color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
#next span{min-width:0;text-wrap:balance;overflow-wrap:break-word}
#next i{display:block;width:40px;height:2px;border-radius:1px;background:var(--line2);overflow:hidden;flex:none}
#next i::after{content:"";display:block;height:100%;width:var(--p,0%);background:var(--gold);transition:width .4s}
#opts{display:grid;gap:8px}
.ans{pointer-events:auto;display:grid;place-items:center;min-height:56px;padding:10px 16px;border-radius:14px;border:1px solid rgba(255,255,255,.16);
  background:rgba(8,11,16,.86);color:#fff;text-align:center;font:500 17px/1.25 var(--mono);transition:border-color .15s,background .15s,transform .1s,opacity .15s}
.ans:active{transform:scale(.985)}
.ans span{min-width:0;overflow-wrap:anywhere}
.ans.ok{border-color:var(--good);background:rgba(95,211,154,.2)}
.ans.no{border-color:var(--bad);background:rgba(255,107,90,.18);animation:shake .4s}
.ans.dim{opacity:.35}
#answers.lock .ans{cursor:default}
@media (min-width:760px){#opts{grid-template-columns:repeat(3,minmax(0,1fr))}.wrap{width:min(100%,820px)}.ans{min-height:72px}}

/* ---------- Floating numbers, banner, countdown ---------- */
#pops{inset:0;padding:0;overflow:hidden}
.pop{position:absolute;transform:translate(-50%,-50%);font:400 italic 32px/1 var(--display);color:var(--good);text-shadow:0 2px 14px #000;animation:rise 1s ease-out forwards;white-space:nowrap}
.pop.bad{color:var(--bad)} .pop.gold{color:var(--gold)}
@keyframes rise{0%{opacity:0;transform:translate(-50%,-30%)}15%{opacity:1;transform:translate(-50%,-50%)}100%{opacity:0;transform:translate(-50%,-150%)}}
#banner{top:44%;left:50%;right:auto;transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);background:var(--plate);padding:12px 22px 14px;border-radius:20px;text-align:center;
  display:grid;justify-items:center;transition:opacity .45s,transform .45s,visibility .45s}
#banner.off{transform:translate(-50%,12px)}
#banner b{font:400 italic clamp(32px,9vw,46px)/1.05 var(--display);color:var(--bc,var(--gold))}
#banner small{display:block;font:400 13px/1.5 var(--mono);color:var(--soft);margin-top:4px}
#count{top:28%;display:grid;justify-items:center;gap:18px;text-align:center}
#countN{font:300 italic 120px/1 var(--display);color:#fff;text-shadow:0 0 3px #000,0 0 14px rgba(0,0,0,.7),0 6px 34px rgba(0,0,0,.8)}
#countN.tick{animation:tick .9s ease-out}
@keyframes tick{0%{transform:scale(1.4);opacity:0}25%{opacity:1}100%{transform:scale(.9);opacity:.15}}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0}

/* ---------- Menus ---------- */
#sheet{inset:0;pointer-events:auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-y;
  background:rgba(6,9,13,.93);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:opacity .45s,visibility .45s}
#sheet.peek{background:linear-gradient(180deg,rgba(6,9,13,.7) 0%,rgba(6,9,13,.25) 24%,rgba(6,9,13,0) 36%,rgba(6,9,13,0) 56%,rgba(6,9,13,.9) 80%);-webkit-backdrop-filter:none;backdrop-filter:none}
#sheet.dim{background:rgba(6,9,13,.82)}
#sheet.reveal{background:linear-gradient(180deg,rgba(6,9,13,0) 0%,rgba(6,9,13,0) 26%,rgba(6,9,13,.94) 50%);-webkit-backdrop-filter:none;backdrop-filter:none}
.screen{width:100%;max-width:520px;min-height:100vh;min-height:100dvh;margin:0 auto;display:flex;flex-direction:column;gap:22px;
  padding-top:calc(16px + env(safe-area-inset-top,0px))}
.screen.pb{padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
.screen.center{justify-content:center;padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
.screen.low{justify-content:flex-end;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.screen.home{justify-content:space-between;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}
.topbar.end{justify-content:flex-end;min-height:40px}
.audio{display:flex;gap:8px}
.iconbtn{position:relative;width:40px;height:40px;border-radius:50%;border:1px solid var(--line2);background:rgba(9,13,19,.6);display:grid;place-items:center;color:var(--ink);padding:0}
.iconbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.iconbtn[aria-pressed="false"]{color:var(--dim)}
.iconbtn[aria-pressed="false"]::after{content:"";position:absolute;width:24px;height:2px;border-radius:1px;background:var(--dim);transform:rotate(-45deg)}
.toggle{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:var(--chip);font:500 12px/1 var(--mono);color:var(--soft)}
.toggle i{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.toggle[aria-pressed="true"]{color:var(--ink)}
.toggle[aria-pressed="true"] i{background:var(--good)}
h1,h2{margin:0;font-weight:500;font-family:var(--display);text-wrap:balance}
.head{display:grid;gap:8px}
.head h1{font-size:clamp(34px,9vw,44px);line-height:1.02}
.lead{font:400 14px/1.45 var(--mono);color:var(--soft);margin:0}
.brand{text-align:center;display:grid;gap:8px}
.brandbig{font:300 italic clamp(62px,19vw,98px)/.9 var(--display);margin:0;letter-spacing:-.01em;text-shadow:0 4px 30px rgba(0,0,0,.5)}
.brandbig em{font-style:normal;color:var(--gold)}
.home .lead{text-align:center}
.bottom{display:grid;gap:14px}
.cta{width:100%;height:58px;border:0;border-radius:16px;background:var(--ember);color:#fff;font:500 16px/1 var(--mono);transition:transform .1s,background .15s}
.cta:active{transform:scale(.985);background:var(--ember2)}
.cta.big{height:64px;font-size:18px}
.ghost{width:100%;height:52px;border-radius:16px;border:1px solid var(--line2);background:var(--chip);font:500 15px/1 var(--mono);color:var(--ink)}
.back{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 18px 0 14px;border-radius:999px;border:1px solid var(--line2);background:var(--chip);font:500 13px/1 var(--mono);color:var(--ink)}
.back span{font-size:17px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{display:grid;align-content:space-between;justify-items:start;gap:14px;min-height:120px;padding:16px;border-radius:16px;text-align:left;min-width:0;color:var(--ink);
  border:1px solid color-mix(in srgb,var(--h) 38%,transparent);background:linear-gradient(155deg,color-mix(in srgb,var(--h) 18%,transparent),rgba(232,238,244,.02) 70%);transition:transform .1s,background .15s}
.tile:active{transform:scale(.98);background:color-mix(in srgb,var(--h) 22%,transparent)}
.tile .tx{display:grid;gap:5px;min-width:0}
.tile strong{font:500 23px/1.05 var(--display);overflow-wrap:anywhere}
.tile .tx span{font:400 12px/1.35 var(--mono);color:var(--soft)}
.sicon{width:38px;height:38px;color:var(--h)}
.sicon svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:20px minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;min-height:60px;padding:10px 14px;
  border-radius:14px;border:1px solid var(--line2);background:rgba(232,238,244,.04);text-align:left;cursor:pointer;color:var(--ink);transition:background .15s,border-color .15s}
.row .tx{display:grid;gap:4px;min-width:0}
.row .tx strong{font:500 15px/1.2 var(--mono)}
.row .tx span{font:400 11px/1.35 var(--mono);color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.radio{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center}
.row[aria-pressed="true"]{border-color:var(--ember2);background:rgba(255,106,79,.1)}
.row[aria-pressed="true"] .radio{border-color:var(--ember2)}
.row[aria-pressed="true"] .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--ember2)}
.best{font:400 11px/1 var(--mono);color:var(--soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.footer{position:sticky;bottom:0;margin-top:auto;display:grid;gap:10px;
  margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding:22px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(rgba(6,9,13,0),#06090d 22px)}
.seg3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;border-radius:14px;background:rgba(232,238,244,.06);border:1px solid var(--line)}
.seg3 button{height:40px;border:0;border-radius:10px;background:none;cursor:pointer;font:500 13px/1 var(--mono);color:var(--soft);transition:background .15s,color .15s,transform .1s}
.seg3 button.d1{color:#3ddc84}.seg3 button.d2{color:#ffc233}.seg3 button.d3{color:#ff5a4a}
.seg3 button[aria-pressed="true"]{color:#0b0f14;transform:scale(1.02)}
.seg3 button.d1[aria-pressed="true"]{background:#3ddc84}
.seg3 button.d2[aria-pressed="true"]{background:#ffc233}
.seg3 button.d3[aria-pressed="true"]{background:#ff5a4a}
.seg3.time button[aria-pressed="true"]{background:var(--ink)}
.actions{display:grid;gap:10px}
.center .head,.low .head{text-align:center;justify-items:center}
.bigscore{font:400 88px/.95 var(--display);font-variant-numeric:tabular-nums;margin:0}
.bigscore small{font:400 italic 26px/1 var(--display);color:var(--soft);margin-left:6px}
.pill{font:400 13px/1 var(--mono);padding:7px 12px;border-radius:999px;border:1px solid var(--line2);color:var(--soft);margin:0}
.pill.best{border-color:rgba(255,210,63,.6);color:var(--gold)}
.mark{font:400 13px/1.5 var(--mono);color:var(--soft);margin:0;text-align:center;text-wrap:balance}
.mark b{font:400 italic 22px/1 var(--display);color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line2);border-radius:16px;overflow:hidden;background:rgba(6,9,13,.6)}
.stats div{display:grid;gap:6px;padding:14px 6px;text-align:center;min-width:0}
.stats div+div{border-left:1px solid var(--line2)}
.stats strong{font:500 26px/1 var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.stats strong.long{font-size:21px}
.stats span{font:400 12px/1.25 var(--mono);color:var(--soft)}
.review{display:grid;gap:10px}
.review h3{margin:0;font:400 13px/1 var(--mono);color:var(--soft)}
.review ol{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.review li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--chip);font:400 13px/1.35 var(--mono)}
.review li > span{color:var(--soft);min-width:0;display:flex;align-items:center;gap:8px;overflow-wrap:anywhere}
.review li img{height:20px;border-radius:2px}
.review li > div{text-align:right}
.review li s{color:var(--bad);text-decoration-thickness:1px;margin-right:8px}
.review li b{color:var(--good);font-weight:500}
.perfect{font:400 italic 20px/1.3 var(--display);color:var(--good);text-align:center;margin:0}
.foot{font:400 12px/1.4 var(--mono);color:var(--dim);text-align:center;margin:0}
.hint{font:400 12px/1.45 var(--mono);color:var(--soft);margin:0;text-align:center}
@media (prefers-reduced-motion:reduce){#countN.tick,#clock.low{animation:none}*{transition-duration:.01s!important}}
</style>
</head>
<body>

<!-- HUD -->
<div id="hud" class="ui off">
  <button type="button" id="pause" class="round push" aria-label="Pause"><i></i><i></i></button>
  <div id="mid">
    <div id="meters">
      <div class="meter" id="floors"><b id="floorsN">0</b><small id="floorsL">floors</small></div>
      <div class="meter" id="clock" role="timer" aria-label="Seconds left"><b id="clockN">15</b><small id="clockL">sec</small></div>
    </div>
    <svg id="timebar" viewBox="0 0 169.6 3" preserveAspectRatio="none" aria-hidden="true"><line class="track" x1="0" y1="1.5" x2="169.6" y2="1.5"/><line class="fill" id="clockFill" x1="0" y1="1.5" x2="169.6" y2="1.5" stroke-dasharray="169.6" stroke-dashoffset="0"/></svg>
    <div id="chips"><span class="chip" id="streak" hidden><b id="streakN">3</b> in a row</span></div>
  </div>
  <button type="button" id="mute" class="round push" aria-label="Sound" aria-pressed="true">♪</button>
</div>
<div id="qbox" class="ui off" aria-live="polite">
  <img id="qimg" alt="Flag" hidden>
  <span id="qtag" hidden></span>
  <div id="qtext"></div>
</div>
<div id="answers" class="ui off">
  <div class="wrap">
    <div id="next"><b id="altN">0 m</b><span id="nextT">Next: a two-storey house, 8 m</span><i id="nextP"></i></div>
    <div id="opts">
      <button type="button" class="ans push" data-i="0"><span></span></button>
      <button type="button" class="ans push" data-i="1"><span></span></button>
      <button type="button" class="ans push" data-i="2"><span></span></button>
    </div>
  </div>
</div>
<div id="pops" class="ui"></div>
<div id="banner" class="ui off"><b id="bannerB"></b><small id="bannerS"></small></div>
<div id="count" class="ui off">
  <div id="countN"></div>
</div>
<div id="flash"></div>

<!-- Menus -->
<div id="sheet" class="ui">
  <div id="menu">
    <section class="screen home" id="scrHome">
      <div>
        <header class="topbar end">
          <div class="audio">
            <button type="button" class="iconbtn push" id="musicT" aria-pressed="true" aria-label="Music"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg></button>
            <button type="button" class="iconbtn push" id="sfxT" aria-pressed="true" aria-label="Sound effects"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg></button>
          </div>
        </header>
        <div class="brand">
          <h1 class="brandbig">Stack<em>fall</em></h1>
          <p class="lead">Right answers stack up. Wrong ones knock it down.</p>
        </div>
      </div>
      <div class="bottom">
        <button type="button" class="cta big push" id="playBtn">Play</button>
      </div>
    </section>

    <section class="screen pb" id="stepSubj" hidden>
      <header class="topbar">

<script src="three.min.js"></script>
<script src="questions.js"></script>
<script>
(()=>{
const $=id=>document.getElementById(id);
const {SUBJECTS,SICON,DIFFNAME,stream,ri}=EduQ;
const el=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e};
const fmtT=s=>{s=Math.max(0,Math.ceil(s));return s>=60?`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`:String(s)};
/* Chess-clock style: start with a few seconds, right answers add time, wrong ones take it away.
   The clock only runs while a question is up. Bonus time shrinks by 0.5 s every 8 right answers (never below 0.5 s),
   and the clock can't go above start + 5 s, so every run ends sooner or later. */
const CLOCKS={quick:{name:'Quick',start:10,plus:2,minus:2},normal:{name:'Normal',start:15,plus:2,minus:2},relaxed:{name:'Relaxed',start:20,plus:3,minus:2}};
const fmtClock=s=>s<=0?'0':s<5?s.toFixed(1):String(Math.ceil(s));
const clockHint=c=>`Start with ${c.start} s. Right answers add ${c.plus} s, wrong ones take ${c.minus} s.`;
const fmtLong=s=>s>=60?`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`:`${s} sec`;
/* Subject hues shared with Lanefall's menus; floors are drawn in deeper shades of the same hue */
const SHUE={english:'#ff7a5c',math:'#f2c46d',geo:'#5fd39a',science:'#6cb8ff',info:'#b48cff',mix:'#ff7ac6'};

/* Every floor is 3 m. Real landmarks give the height a meaning */
const M_PER_FLOOR=3;
const MARKS=[[8,'a two-storey house'],[30,'a blue whale on its tail'],[50,'the Arc de Triomphe'],[56,'the Leaning Tower of Pisa'],[73,'the Taj Mahal'],
  [84,"Romania's Parliament Palace"],[93,'the Statue of Liberty'],[96,'Big Ben'],[135,'the London Eye'],[139,'the Great Pyramid'],[330,'the Eiffel Tower'],[443,'the Empire State Building'],[828,'the Burj Khalifa']];
const markFor=m=>{let prev=null,next=null;for(const k of MARKS){if(k[0]<=m)prev=k;else{next=k;break}}return{prev,next}};
const compare=(m,k)=>k[0]===m?`as tall as ${k[1]}`:`taller than ${k[1]} (${k[0]} m)`;

/* ======================= SETTINGS ======================= */
const cfg={subject:'english',topic:'irregular',diffs:{},clock:'normal'};
try{const s=JSON.parse(localStorage.getItem('stackfall-cfg')||'{}');Object.assign(cfg,s);if(!cfg.diffs)cfg.diffs={}}catch(e){}
if(!CLOCKS[cfg.clock])cfg.clock='normal';delete cfg.time;
const CLK=()=>CLOCKS[cfg.clock]||CLOCKS.normal;
const saveCfg=()=>{try{localStorage.setItem('stackfall-cfg',JSON.stringify(cfg))}catch(e){}};
const curSubject=()=>SUBJECTS.find(s=>s.id===cfg.subject)||SUBJECTS[0];
const curTopic=()=>{const s=curSubject();return s.topics.find(t=>t.id===cfg.topic)||s.topics[0]};
const topicDiff=tp=>cfg.diffs[tp.id]||tp.d;
const DIFF=()=>topicDiff(curTopic());
const bestKey=(id,d,t)=>`stackfall-best-${id||curTopic().id}-d${d||DIFF()}-c${t||cfg.clock}`;
const getBest=(id,d,t)=>{try{return +localStorage.getItem(bestKey(id,d,t))||0}catch(e){return 0}};

/* Results log for the future portal: kept locally, and posted to a parent page if Stackfall runs inside one */
function logResult(r){
  try{const k='edu-results',a=JSON.parse(localStorage.getItem(k)||'[]');a.push(r);localStorage.setItem(k,JSON.stringify(a.slice(-200)))}catch(e){}
  try{if(window.parent&&window.parent!==window)window.parent.postMessage({type:'edu-result',result:r},'*')}catch(e){}
}

/* ======================= MENUS ======================= */
function renderSubjects(){const box=$('subjects');box.innerHTML='';
  SUBJECTS.forEach(s=>{const b=el('button','tile push');b.type='button';b.style.setProperty('--h',SHUE[s.id]);
    const tx=el('span','tx');tx.append(el('strong',null,s.name),el('span',null,`${s.topics.length} topics`));
    const ic=el('span','sicon');ic.innerHTML=`<svg viewBox="0 0 24 24" aria-hidden="true">${SICON[s.id]}</svg>`;
    b.append(ic,tx);b.onclick=()=>{if(cfg.subject!==s.id){cfg.subject=s.id;cfg.topic=s.topics[0].id}saveCfg();paintPalette();go('stepTopic')};box.append(b)})}
function renderTopics(){const s=curSubject(),t=curTopic();cfg.topic=t.id;$('subName').textContent=s.name;
  const box=$('topics');box.innerHTML='';box.style.setProperty('--h',SHUE[s.id]);
  s.topics.forEach(tp=>{const b=el('button','row');b.type='button';b.setAttribute('aria-pressed',tp.id===cfg.topic);
    const tx=el('span','tx');tx.append(el('strong',null,tp.name),el('span',null,tp.bl));
    const side=el('span');const bs=getBest(tp.id,topicDiff(tp));if(bs)side.append(el('span','best',`best ${bs}`));
    b.append(el('span','radio'),tx,side);b.onclick=()=>{cfg.topic=tp.id;saveCfg();renderTopics()};box.append(b)});
  $('startBtn').textContent='Start';$('clockHint').textContent=clockHint(CLK());
  document.querySelectorAll('#diffSeg button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.d===DIFF()));
  document.querySelectorAll('#clockSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.c===cfg.clock))}
document.querySelectorAll('#diffSeg button').forEach(b=>b.onclick=()=>{cfg.diffs[curTopic().id]=+b.dataset.d;saveCfg();renderTopics()});
document.querySelectorAll('#clockSeg button').forEach(b=>b.onclick=()=>{cfg.clock=b.dataset.c;saveCfg();renderTopics()});
const SCREENS=['scrHome','stepSubj','stepTopic'];
function go(id){SCREENS.forEach(x=>$(x).hidden=x!==id);$('sheet').classList.toggle('peek',id==='scrHome');
  ({scrHome:()=>{},stepSubj:renderSubjects,stepTopic:renderTopics})[id]();$('sheet').scrollTop=0}
document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)go(b.dataset.go)});
$('playBtn').onclick=()=>go('stepSubj');

/* ======================= AUDIO (Lanefall engine) ======================= */
const A={ctx:null,music:true,sfx:true};
try{const s=JSON.parse(localStorage.getItem('stackfall-audio')||'{}');if(s.music===false)A.music=false;if(s.sfx===false)A.sfx=false}catch(e){}
let C,master,musicBus,sfxBus,keysLP,delay,noiseBuf;
function initAudio(){
  if(A.ctx){if(A.ctx.state!=='running')A.ctx.resume();return}
  try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  C=A.ctx=new AC();master=C.createGain();master.gain.value=.9;
  const comp=C.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=3;master.connect(comp);comp.connect(C.destination);
  musicBus=C.createGain();musicBus.gain.value=A.music?.5:0;
  const lofi=C.createBiquadFilter();lofi.type='lowpass';lofi.frequency.value=5200;lofi.Q.value=.3;musicBus.connect(lofi);lofi.connect(master);
  sfxBus=C.createGain();sfxBus.gain.value=.7;sfxBus.connect(master);
  keysLP=C.createBiquadFilter();keysLP.type='lowpass';keysLP.frequency.value=1500;keysLP.connect(musicBus);
  delay=C.createDelay(1);delay.delayTime.value=60/BPM*.75;const fb=C.createGain();fb.gain.value=.35;const dl=C.createGain();dl.gain.value=.35;
  delay.connect(fb);fb.connect(delay);delay.connect(dl);dl.connect(musicBus);
  noiseBuf=C.createBuffer(1,C.sampleRate*2,C.sampleRate);const nd=noiseBuf.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
  nextT=C.currentTime+.1;setInterval(schedule,30);
}
['pointerdown','pointerup','touchend','click'].forEach(ev=>document.addEventListener(ev,initAudio,{capture:true}));
document.addEventListener('keydown',initAudio,{capture:true});
document.addEventListener('visibilitychange',()=>{if(!A.ctx)return;document.hidden?A.ctx.suspend():A.ctx.resume()});
const mtof=m=>440*Math.pow(2,(m-69)/12);
function env(g,t,a,peak,dur){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+dur)}
function osc(type,f,t,dur,peak,dest,f1,a=.01){const o=C.createOscillator(),g=C.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur);env(g,t,a,peak,dur);o.connect(g);g.connect(dest);o.start(t);o.stop(t+dur+.05);return o}
function noise(t,dur,peak,dest,type,f0,f1,q=1){const s=C.createBufferSource();s.buffer=noiseBuf;const f=C.createBiquadFilter();f.type=type;f.Q.value=q;
  f.frequency.setValueAtTime(f0,t);if(f1)f.frequency.exponentialRampToValueAtTime(f1,t+dur);const g=C.createGain();env(g,t,.005,peak,dur);
  s.connect(f);f.connect(g);g.connect(dest);s.start(t,Math.random());s.stop(t+dur+.05)}
/* lo-fi loop, a touch brighter than Lanefall's: Dm9 · Bbmaj7 · F · C at 84 bpm */
const BPM=84,S16=60/BPM/4;let nextT=0,step=0;
const CHORDS=[[50,57,60,64],[46,53,57,62],[53,57,60,65],[48,55,60,64]];
const PENTA=[74,76,77,81,84,86];
function key(m,t,dur,v){const f=mtof(m);[['triangle',0],['sine',7]].forEach(([ty,det])=>{const o=C.createOscillator(),g=C.createGain();o.type=ty;
  o.frequency.value=f;o.detune.value=det;env(g,t,.02,v,dur);o.connect(g);g.connect(keysLP);o.start(t);o.stop(t+dur+.1)})}
function playStep(s,t){
  if(!A.music)return;const bar=Math.floor(s/16)%4,b=s%16;if(b%2===1)t+=S16*.2;const ch=CHORDS[bar];
  if(b===0)ch.forEach((m,i)=>key(m,t+i*.012,2.6,.042));
  if(b===8)ch.slice(1).forEach((m,i)=>key(m+12,t+i*.01,1,.02));
  if(b===0||b===6||b===10)osc('sine',mtof(ch[0]-12),t,b===0?1:.5,.2,musicBus,null,.02);
  if(b===0||b===10)osc('sine',115,t,.28,.5,musicBus,42,.003);
  if(b===4||b===12){noise(t,.15,.12,musicBus,'bandpass',1800,null,.7);osc('triangle',190,t,.08,.05,musicBus,120)}
  if(b%2===0)noise(t,.03,b%4===2?.026:.013,musicBus,'highpass',8000);
  if(b%2===0&&Math.random()<.18){const m=PENTA[ri(0,PENTA.length-1)];const o=C.createOscillator(),g=C.createGain();o.type='sine';o.frequency.value=mtof(m);
    env(g,t,.01,.032,.9);o.connect(g);g.connect(keysLP);g.connect(delay);o.start(t);o.stop(t+1)}
}
function schedule(){if(!C||C.state!=='running')return;while(nextT<C.currentTime+.15){playStep(step,nextT);nextT+=S16;step=(step+1)%64}}
const S={
  ok:()=>A.ctx&&A.sfx&&C.state==='running',
  click(){if(!this.ok())return;osc('sine',1320,C.currentTime,.05,.08,sfxBus,880)},
  drop(){if(!this.ok())return;noise(C.currentTime,.35,.08,sfxBus,'bandpass',600,2400,1.4)},
  land(h,gold){if(!this.ok())return;const t=C.currentTime,f=(150+Math.min(h,40)*6)*(.94+Math.random()*.12);osc('sine',f,t,.16,.26,sfxBus,f*.4,.003);noise(t,.08,.09,sfxBus,'lowpass',1800,300);
    if(gold)[88,91,96,100].forEach((m,i)=>osc('triangle',mtof(m),t+.05+i*.06,.45,.08,sfxBus))},
  correct(){if(!this.ok())return;const t=C.currentTime;[84,88,91].forEach((m,i)=>osc('triangle',mtof(m),t+i*.06,.4,.09,sfxBus))},
  wrong(){if(!this.ok())return;const t=C.currentTime;osc('sawtooth',220,t,.38,.07,sfxBus,98);osc('square',110,t+.02,.32,.035,sfxBus,70)},
  crumble(){if(!this.ok())return;const t=C.currentTime;noise(t,.7,.32,sfxBus,'lowpass',2200,160,.5);osc('sine',90,t,.5,.35,sfxBus,32,.002);
    [0,.12,.22].forEach(d=>osc('sine',140+Math.random()*60,t+.25+d,.12,.12,sfxBus,60,.003))},
  splash(){if(!this.ok())return;const t=C.currentTime;noise(t,.45,.16,sfxBus,'bandpass',1400,400,.8);noise(t+.05,.3,.08,sfxBus,'highpass',3000)},
  tick(n){if(!this.ok())return;osc('sine',n?660:990,C.currentTime,n?.12:.35,.13,sfxBus)},
  clock(){if(!this.ok())return;osc('square',1800,C.currentTime,.03,.03,sfxBus)},
  bell(){if(!this.ok())return;const t=C.currentTime;osc('sine',mtof(91),t,.9,.04,sfxBus);osc('sine',mtof(98),t+.03,.8,.02,sfxBus)},
  record(){if(!this.ok())return;const t=C.currentTime;[79,84,88,91,96].forEach((m,i)=>osc('triangle',mtof(m),t+i*.08,.6,.1,sfxBus))},
  end(){if(!this.ok())return;const t=C.currentTime;osc('sine',mtof(84),t,1.2,.12,sfxBus);osc('sine',mtof(79),t+.15,1.2,.1,sfxBus);osc('sine',mtof(72),t+.3,1.6,.12,sfxBus)},
};
document.addEventListener('click',e=>{if(e.target.closest('button:not(.ans)'))S.click()});
function paintAudio(){
  ['musicT','musicT2'].forEach(i=>$(i).setAttribute('aria-pressed',A.music));
  ['sfxT','sfxT2'].forEach(i=>$(i).setAttribute('aria-pressed',A.sfx));
  $('mute').setAttribute('aria-pressed',A.music||A.sfx);
  if(musicBus)musicBus.gain.setTargetAtTime(A.music?(state==='paused'?.22:.5):0,C.currentTime,.15);
  try{localStorage.setItem('stackfall-audio',JSON.stringify({music:A.music,sfx:A.sfx}))}catch(e){}
}
['musicT','musicT2'].forEach(i=>$(i).onclick=()=>{initAudio();A.music=!A.music;paintAudio()});
['sfxT','sfxT2'].forEach(i=>$(i).onclick=()=>{initAudio();A.sfx=!A.sfx;paintAudio()});
$('mute').onclick=()=>{initAudio();const on=!(A.music||A.sfx);A.music=A.sfx=on;paintAudio()};

/* ======================= RENDERER ======================= */
const R=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
R.setPixelRatio(Math.min(devicePixelRatio,2));R.outputEncoding=THREE.sRGBEncoding;R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.prepend(R.domElement);
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(48,1,.1,400);
scene.fog=new THREE.Fog(0xffe2c4,40,170);
const W=()=>Math.max(innerWidth,R.domElement.clientWidth||0),H=()=>Math.max(innerHeight,R.domElement.clientHeight||0);
function fit(){R.setSize(W(),H(),false);cam.aspect=W()/H();cam.updateProjectionMatrix()}
addEventListener('resize',fit);fit();

/* sky dome: the app icon's dusk, deepening to night with stars as the tower climbs */
const skyU={top:{value:new THREE.Color()},bot:{value:new THREE.Color()}};
const sky=new THREE.Mesh(new THREE.SphereGeometry(300,32,16),new THREE.ShaderMaterial({uniforms:skyU,side:THREE.BackSide,depthWrite:false,fog:false,
  vertexShader:'varying vec3 vP;void main(){vP=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:'uniform vec3 top;uniform vec3 bot;varying vec3 vP;void main(){float h=smoothstep(-.06,.6,vP.y);gl_FragColor=vec4(mix(bot,top,h),1.);}'}));
scene.add(sky);
const SKY=[ // floors, top, horizon
  [0,0x16194a,0xff9f80],[14,0x121546,0x8a5ad0],[28,0x0b0e33,0x3b2f86],[45,0x05071a,0x1a1747],[70,0x030410,0x0c0b22]];
const cA=new THREE.Color(),cB=new THREE.Color();let night=0;
function skyAt(f){let i=0;while(i<SKY.length-2&&f>SKY[i+1][0])i++;const a=SKY[i],b=SKY[i+1],k=Math.min(1,Math.max(0,(f-a[0])/(b[0]-a[0])));
  skyU.top.value.copy(cA.set(a[1])).lerp(cB.set(b[1]),k);skyU.bot.value.copy(cA.set(a[2])).lerp(cB.set(b[2]),k);scene.fog.color.copy(skyU.bot.value);
  night=Math.min(1,Math.max(0,(f-12)/22))}

const hemi=new THREE.HemisphereLight(0xc4ccff,0x2a1a30,.6);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffc29a,1);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
Object.assign(sun.shadow.camera,{left:-6,right:6,top:8,bottom:-8,near:1,far:50});sun.shadow.bias=-.0008;scene.add(sun,sun.target);
const moonL=new THREE.DirectionalLight(0x8ea8ff,.15);moonL.position.set(-10,20,-6);scene.add(moonL);
const glowL=new THREE.PointLight(0xffc070,.9,9,2);scene.add(glowL);   // the warm glow around the dangling floor, as in the icon

const mat=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.8},o));
const flat=(c,o={})=>mat(c,Object.assign({flatShading:true},o));
function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=4;return t}

/* still dark water and a stepped stone plinth with an ember edge */
const sea=new THREE.Mesh(new THREE.CircleGeometry(260,64),mat(0x0d1326,{roughness:.28,metalness:.35}));sea.rotation.x=-Math.PI/2;sea.receiveShadow=true;scene.add(sea);
let plTop=0;[[3.4,.24,0x161d2a],[2.8,.2,0x202938]].forEach(([w,h,c])=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,w),flat(c));m.position.y=plTop+h/2;plTop+=h;m.castShadow=m.receiveShadow=true;scene.add(m)});
const plEdge=new THREE.Mesh(new THREE.BoxGeometry(2.82,.02,2.82),new THREE.MeshBasicMaterial({color:0xff6a4f}));plEdge.position.y=plTop-.05;scene.add(plEdge);
const BASE_Y=plTop,PLAT=1.7;
/* slow rising motes, Lanefall's atmosphere */
const DN=260,dg=new THREE.BufferGeometry(),dp=new Float32Array(DN*3);
for(let i=0;i<DN;i++){const a=Math.random()*6.283,r=3+Math.random()*18;dp[i*3]=Math.cos(a)*r;dp[i*3+1]=Math.random()*40;dp[i*3+2]=Math.sin(a)*r}
dg.setAttribute('position',new THREE.BufferAttribute(dp,3));
const dust=new THREE.Points(dg,new THREE.PointsMaterial({color:0xffd9b8,size:.06,transparent:true,opacity:.45,depthWrite:false}));scene.add(dust);
/* stars come out as dusk turns to night */
const SN=500,sgeo=new THREE.BufferGeometry(),sp=new Float32Array(SN*3);
for(let i=0;i<SN;i++){const u=Math.random()*6.283,v=Math.acos(Math.random()*.9),r=250;sp[i*3]=Math.sin(v)*Math.cos(u)*r;sp[i*3+1]=Math.cos(v)*r;sp[i*3+2]=Math.sin(v)*Math.sin(u)*r}
sgeo.setAttribute('position',new THREE.BufferAttribute(sp,3));
const stars=new THREE.Points(sgeo,new THREE.PointsMaterial({color:0xffffff,size:1.4,sizeAttenuation:false,transparent:true,opacity:0,fog:false,depthWrite:false}));scene.add(stars);

/* ======================= FLOORS ======================= */
const FH=.56,BW=2.15;
/* plain slabs with a thin cream edge on top, like the icon */
const BODY=new THREE.BoxGeometry(BW,FH*.9,BW),ROOF=new THREE.BoxGeometry(BW+.04,FH*.07,BW+.04);
const ROOFM=flat(0xfff3e2);
const floorMats=(c,o={})=>flat(c,o);
let palette=[];
/* every subject builds with the icon's warm ramp: coral, orange, amber, salmon */

  const roof=new THREE.Mesh(ROOF,ROOFM);roof.position.y=FH*.9+FH*.035;g.add(body,roof);g.traverse(m=>{if(m.isMesh){m.castShadow=m.receiveShadow=true}});g.body=body;return g}

    const a=orbit+Math.PI+(Math.random()-.5)*2.4,s=2.2+Math.random()*1.8+i*.6;

/* small particle pool: dust on landing, splashes, confetti */

  else{m=new THREE.Mesh(BITG,BITM[kind]);const a=i/n*6.283+Math.random()*.3,s=kind==='water'?1.2+Math.random():2+Math.random();v=new THREE.Vector3(Math.cos(a)*s,kind==='water'?3+Math.random()*2:.6+Math.random(),Math.sin(a)*s)}

function tickCount(n){const c=$('countN');c.textContent=n||'Go';c.classList.remove('tick');void c.offsetWidth;c.classList.add('tick');S.tick(n)}
function ask(){cur=next();lock=false;$('answers').classList.remove('lock');const qb=$('qbox');qb.classList.remove('right','wrong');
  const qt=$('qtext');qt.className=cur.code?'code':'';qt.textContent=cur.q;const tg=$('qtag');tg.hidden=!cur.code;tg.textContent=cur.code||'';

const CHEER={3:['Nice','3 in a row'],5:['Gold floor','5 in a row'],8:['On a roll','8 in a row'],10:['Ten straight','still going'],15:['Fifteen straight','not bad at all'],20:['Twenty straight','okay, show-off']};

    const gold=streak%5===0;if(gold)setTimeout(()=>{if(state==='run'||state==='over')addBlock(true)},200);

  setTimeout(()=>{if(state==='run')ask()},ok?360:950)}
ansEls.forEach((b,i)=>b.addEventListener('pointerdown',e=>{e.preventDefault();answer(i)}));
ansEls.forEach((b,i)=>b.addEventListener('click',e=>{if(e.detail===0)answer(i)}));

function pause(){if(state!=='run'&&state!=='count')return;pausedFrom=state;state='paused';show('count',false);
  $('pLine').textContent=`${tower.length} floors · ${Math.ceil(timeLeft)} s on the clock`;panel('pauseP');paintAudio()}
function resume(){if(state!=='paused')return;panel(null);state='count';countT=pausedFrom==='count'?3.2:1.2;show('count',true);tickCount(pausedFrom==='count'?3:1);paintAudio()}
function finish(cause){
  if(state!=='run'&&state!=='paused')return;state='over';show('qbox',false);show('answers',false);show('count',false);S.end();
  if(hang)hang.visible=false;rope.visible=false;
  const sc=tower.length,isBest=sc>best&&sc>0;if(isBest){best=sc;try{localStorage.setItem(bestKey(),best)}catch(e){}}
  logResult({game:'stackfall',subject:curSubject().id,topic:curTopic().id,topicName:curTopic().name,level:DIFF(),clock:cfg.clock,duration:Math.round(played),
    timeUsed:Math.round(played),score:sc,peak,right,asked,bestStreak,missed:missed.map(m=>({q:m.q,answer:m.answer,picked:m.picked})),at:new Date().toISOString()});

    $('rCause').textContent=cause==='quit'?'You ended the run':'Out of time';$('rScore').textContent=sc;

    $('rTopic').textContent=`${curTopic().name} · ${DIFFNAME[DIFF()].toLowerCase()} · ${CLK().name.toLowerCase()} clock · lasted ${Math.round(played)} s`;
    $('rRight').textContent=`${right}/${asked}`;$('rRight').classList.toggle('long',`${right}/${asked}`.length>5);$('rPeak').textContent=peak;$('rStreak').textContent=bestStreak;
    const rv=$('review');rv.innerHTML='';
    if(missed.length){rv.append(el('h3',null,'You missed'));const ol=el('ol'),seen=new Set();
      missed.forEach(m=>{const k=m.q+m.answer+(m.img||'');if(seen.has(k))return;seen.add(k);const li=el('li'),q=el('span');if(m.img){const im=el('img');im.src=m.img;im.alt='';q.append(im)}q.append(m.q);
        const a=el('div');a.append(el('s',null,m.picked),el('b',null,m.answer));li.append(q,a);ol.append(li)});rv.append(ol)}

    show('hud',false);panel('over')},cause==='quit'?250:2000)}
function toMenu(){state='menu';reset();rope.visible=true;show('hud',false);show('qbox',false);show('answers',false);show('count',false);go('stepTopic');panel('menu')}
$('startBtn').onclick=()=>{rope.visible=true;start()};$('againBtn').onclick=()=>{rope.visible=true;start()};$('menuBtn').onclick=toMenu;
$('pause').onclick=pause;$('resumeBtn').onclick=resume;$('quitBtn').onclick=()=>finish('quit');
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
addEventListener('keydown',e=>{if(e.repeat)return;
  if(e.code==='Escape'||e.code==='KeyP'){state==='paused'?resume():pause();return}
  if(state==='over'&&e.code==='Enter'&&!$('over').hidden&&!(EMBED&&EMBED.lock)){rope.visible=true;start();return}
  const n={Digit1:0,Digit2:1,Digit3:2,Numpad1:0,Numpad2:1,Numpad3:2,ArrowLeft:0,ArrowDown:1,ArrowRight:2}[e.code];
  if(n!=null&&state==='run'){e.preventDefault();answer(n)}});

/* ======================= PORTAL EMBED (edugames contract v1) =======================
   Opened by the portal as ?topic=<id>&level=1-3&time=60|90|120&lock=1 → settings come from the portal and the run starts at once.
   lock=1 (class mode): no replay, no topic menu. Posts edu-ready on load, edu-progress after every answer, edu-result at the end. */
const EMBED=(()=>{const p=new URLSearchParams(location.search);if(!p.get('topic'))return null;
  return{topic:p.get('topic'),level:+p.get('level')||0,clock:p.get('clock'),lock:p.get('lock')==='1'}})();
const toParent=m=>{try{if(window.parent!==window)window.parent.postMessage(m,'*')}catch(e){}};
function applyEmbed(){if(!EMBED)return false;const s=SUBJECTS.find(s=>s.topics.some(t=>t.id===EMBED.topic));if(!s)return false;
  cfg.subject=s.id;cfg.topic=EMBED.topic;if([1,2,3].includes(EMBED.level))cfg.diffs[EMBED.topic]=EMBED.level;if(CLOCKS[EMBED.clock])cfg.clock=EMBED.clock;
  if(EMBED.lock){$('againBtn').hidden=true;$('menuBtn').hidden=true;const n=document.createElement('p');n.textContent='Result sent to your teacher.';
    n.style.cssText='margin:0;text-align:center;color:var(--soft);font:400 13px/1.4 var(--mono)';$('againBtn').parentNode.prepend(n)}
  return true}

/* ======================= LOOP ======================= */
const clock=new THREE.Clock();let t=0,skyF=0;
const camPos=new THREE.Vector3(10,6,10),look=new THREE.Vector3(0,2,0),lookTo=new THREE.Vector3(),camTo=new THREE.Vector3();
paintPalette();reset();go('scrHome');paintAudio();
if(applyEmbed()){rope.visible=true;start()}toParent({type:'edu-ready',game:'stackfall'});
function frame(){
  requestAnimationFrame(frame);
  const realDt=Math.min(clock.getDelta(),.25);let dt=Math.min(realDt,.05);
  if(state==='paused'){R.render(scene,cam);return}
  if(freeze>0){freeze-=realDt;dt=0}   // hit-stop on a wrong answer
  t+=dt;
  if(state==='count'){const prev=Math.ceil(countT-.2);countT-=realDt;const now=Math.ceil(countT-.2);if(now!==prev)tickCount(Math.max(0,now));
    if(countT<=0){state='run';show('count',false);if(!cur||asked===0||lock)ask();else{show('qbox',true);show('answers',true)}S.bell()}}
  if(state==='run'){if(!lock){timeLeft-=realDt;played+=realDt}const sec=Math.ceil(timeLeft);if(sec!==lastSec){lastSec=sec;if(sec<=5&&sec>0)S.clock()}paintClock();if(timeLeft<=0){timeLeft=0;paintClock();finish('time')}}
  if(state==='menu'){menuT-=dt;if(menuT<=0){if(tower.length>=10||(tower.length>6&&Math.random()<.15)){knock(3);S.crumble();menuT=1.5}else{addBlock(Math.random()<.1);menuT=.8+Math.random()*.6}}}

  /* the hanging floor swings like a pendulum and eases down from the crane when it appears */
  if(hang){hangT+=dt;hangX=Math.sin(t*1.7)*.75;const hy=BASE_Y+settledTop()+2.7+Math.max(0,1-hangT*2.5)*4;
    hang.position.set(hangX,hy,0);hang.rotation.set(0,twist+.08,-hangX*.12);
    const pa=rope.geometry.attributes.position.array;pa[0]=hangX;pa[1]=hy+FH;pa[2]=0;pa[3]=hangX*.15;pa[4]=hy+30;pa[5]=0;rope.geometry.attributes.position.needsUpdate=true}

  /* falling floors drop onto the one below with a squash; a lower floor knocked out lets the rest settle down */
  tower.forEach((b,i)=>{const target=i*FH;
    if(!b.settled||b.y>target+.001){b.settled=false;b.vy-=34*dt;b.y+=b.vy*dt;b.x+=(b.ox-b.x)*Math.min(1,dt*6);
      if(b.y<=target){b.y=target;const hard=b.vy<-4;b.vy=0;b.settled=true;b.x=b.ox;
        if(hard){b.sq=.24;const wp=new THREE.Vector3(0,BASE_Y+target,0);burst('dust',wp,10);S.land(i,b.gold);
          if(state!=='menu'){shake=Math.max(shake,.06);popAt(target+FH*1.6,b.gold?'+1 gold':'+1',b.gold?'gold':'');if(b.gold)burst('conf',wp.setY(wp.y+FH),26)}}}}
    b.sq+=(0-b.sq)*Math.min(1,dt*12);b.mesh.position.set(b.x,b.y,b.oz);b.mesh.scale.set(1+b.sq*.22,1-b.sq,1+b.sq*.22)});
  debris.forEach(d=>{d.life+=dt;d.v.y-=22*dt;d.m.position.addScaledVector(d.v,dt);d.m.rotation.x+=d.r.x*dt;d.m.rotation.y+=d.r.y*dt;d.m.rotation.z+=d.r.z*dt;
    const rr=Math.hypot(d.m.position.x,d.m.position.z);
    if(Math.abs(d.m.position.x)<PLAT&&Math.abs(d.m.position.z)<PLAT&&d.m.position.y<BASE_Y+.2&&d.v.y<0&&!d.splash){d.m.position.y=BASE_Y+.2;d.v.y*=-.35;d.v.x*=1.4;d.v.z*=1.4;d.r.multiplyScalar(.6)}
    if(rr>=PLAT&&d.m.position.y<0&&!d.splash){d.splash=true;burst('water',new THREE.Vector3(d.m.position.x,.05,d.m.position.z),12);S.splash();d.v.multiplyScalar(.25)}
    if(d.splash)d.v.y=Math.max(d.v.y,-1.2)});
  for(let i=debris.length-1;i>=0;i--)if(debris[i].life>3.2||debris[i].m.position.y<-3){scene.remove(debris[i].m);debris.splice(i,1)}
  bits.forEach(p=>{p.life+=dt;if(p.kind==='conf'){p.v.y-=7*dt;p.v.multiplyScalar(1-dt*1.6);p.m.rotation.x+=p.r*dt;p.m.rotation.y+=p.r*.7*dt}else p.v.y-=(p.kind==='water'?14:6)*dt;
    p.m.position.addScaledVector(p.v,dt);p.m.scale.setScalar(Math.max(.01,1-Math.max(0,p.life-p.max*.6)/(p.max*.4)))});
  for(let i=bits.length-1;i>=0;i--)if(bits[i].life>bits[i].max){scene.remove(bits[i].m);bits.splice(i,1)}
  /* sway: a damped spring knocked by every hit; taller towers sway a bit more */
  wobV+=(-wob*28-wobV*4.5)*dt;wob+=wobV*dt;const sway=wob*(1+tower.length*.025);
  towerG.rotation.z=sway*.03+Math.sin(t*.8)*Math.min(tower.length,40)*.0003;towerG.rotation.x=sway*.018;

  /* world: the sky deepens with height, stars come out, motes drift up, a warm glow follows the next floor */
  skyF+=(tower.length-skyF)*Math.min(1,dt*1.5);skyAt(skyF);
  stars.material.opacity=night;sun.intensity=1-night*.55;hemi.intensity=.6-night*.2;moonL.intensity=.15+night*.4;
  GOLDM.emissiveIntensity=.35+Math.sin(t*4)*.12;
  if(hang&&hang.visible)glowL.position.set(hang.position.x,hang.position.y+.3,hang.position.z+.6);else glowL.position.set(0,BASE_Y+settledTop()+.8,.6);
  const dpa=dg.attributes.position.array,dTop=BASE_Y+settledTop();for(let i=0;i<DN;i++){dpa[i*3+1]+=dt*.45;if(dpa[i*3+1]>dTop+22)dpa[i*3+1]=dTop-8}dg.attributes.position.needsUpdate=true;

  /* camera: slow orbit that climbs with the top and keeps the crane in view; results pull back to show it all */
  const top=BASE_Y+settledTop();
  orbit+=dt*(state==='menu'?.16:state==='over'?.14:.05);
  const portrait=H()>W();let rad,cy,ly;
  if(state==='over'){const h=Math.max(settledTop(),2.5);rad=Math.max(14,h*(portrait?2.8:1.6)+9);cy=BASE_Y+h*.65+2;ly=BASE_Y+h*.5}
  else if(state==='menu'){rad=13;cy=top+3.4;ly=top+.4}
  else{rad=13+Math.min(tower.length,30)*.05;cy=top+3.6;ly=top+.55}
  if(portrait&&state!=='over')rad*=1.22;
  camTo.set(Math.cos(orbit)*rad,cy,Math.sin(orbit)*rad);camPos.lerp(camTo,1-Math.pow(.03,dt||realDt));
  lookTo.set(0,ly,0);look.lerp(lookTo,1-Math.pow(.02,dt||realDt));
  cam.position.copy(camPos);
  if(shake>0){shake-=realDt;const a=shake*.7;cam.position.x+=(Math.random()-.5)*a;cam.position.y+=(Math.random()-.5)*a}
  cam.lookAt(look);sky.position.copy(cam.position);
  /* on the results, shift the picture up so the whole tower stands above the result card */
  if(state==='over'&&portrait){if(!cam.view||!cam.view.enabled||cam.view.offsetY!==Math.round(H()*.36))cam.setViewOffset(W(),H(),0,Math.round(H()*.36),W(),H())}else if(cam.view&&cam.view.enabled)cam.clearViewOffset();
  sun.position.set(8,top+14,6);sun.target.position.set(0,top-3,0);
  recFrame.material.opacity=.55+Math.sin(t*3)*.35;
  R.render(scene,cam);
}
frame();
})();
</script>
